[project]
name = "calibornia-discord-bot"
version = "0.1.0"
description = "Discord bot for the Calibornia Discord"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "emoji~=2.15.0",
    "py-cord[speed]==2.8.0",
]

[project.scripts]
calibornia-discord-bot = "bot:main"

[dependency-groups]
dev = [
    "mypy~=2.3.0",
    "ruff~=0.15.22",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
files = ["bot.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
